<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLA report</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1.5rem; max-width: 1100px; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
    table { border-collapse: collapse; margin: .5rem 0 1rem; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    th { background: #f3f3f3; }
    .error { color: #b00020; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>SLA report</h1>
  <form id="filters">
    <label>From <input type="date" name="from" required></label>
    <label>To <input type="date" name="to" required></label>
    <label>Site <select name="site_id"><option value="">All</option></select></label>
    <label>Responder <select name="responder_id"><option value="">All</option></select></label>
    <label>Completed late <select name="late"><option value="">Any</option><option value="true">True</option><option value="false">False</option></select></label>
    <label>Within target <select name="within_target"><option value="">Any</option><option value="true">True</option><option value="false">False</option></select></label>
    <label>Sort <select name="sort"><option value="id">ID</option><option value="-id">ID descending</option><option value="response_business_minutes">Response minutes</option><option value="-response_business_minutes">Response minutes descending</option></select></label>
    <button type="submit">Run report</button>
    <button type="button" id="csv">Download CSV</button>
  </form>

  <p id="status" class="muted"></p>
  <h2>Responder summary</h2>
  <table id="responders"><thead><tr><th>Name</th><th>Requests</th><th>Within target</th><th>Completed late</th></tr></thead><tbody></tbody></table>
  <h2>Requests <span id="count" class="muted"></span></h2>
  <table id="requests"><thead><tr><th>ID</th><th>Site</th><th>Responder</th><th>Response minutes</th><th>Within target</th><th>Completed late</th></tr></thead><tbody></tbody></table>
  <button id="next" hidden>Next page</button>

  <script>
    const form = document.querySelector("#filters");
    const status = document.querySelector("#status");
    const responderBody = document.querySelector("#responders tbody");
    const requestBody = document.querySelector("#requests tbody");
    const count = document.querySelector("#count");
    const next = document.querySelector("#next");
    const csv = document.querySelector("#csv");
    let cursor = null;
    let params = null;

    // Build a query string from the current form values (omitting empty ones).
    function currentParams() {
      const query = new URLSearchParams();
      for (const [name, value] of new FormData(form)) if (value !== "") query.set(name, value);
      return query;
    }

    const show = value => value == null ? "-" : String(value);
    function cell(row, value) { const td = document.createElement("td"); td.textContent = show(value); row.append(td); }
    function setStatus(message, error = false) { status.textContent = message; status.className = error ? "error" : "muted"; }
    function fillSelect(select, options) {
      const selected = select.value;
      select.replaceChildren(new Option("All", ""));
      for (const [value, label] of options) select.add(new Option(label, value));
      select.value = selected;
    }
    async function getJSON(url) {
      const response = await fetch(url);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(response.status === 503 ? "The service is still syncing. Try again shortly." : (body.error || response.status));
      return body;
    }
    async function loadPage(append) {
      const query = new URLSearchParams(params);
      query.set("limit", "50");
      if (append && cursor) query.set("cursor", cursor);
      const page = await getJSON("/api/requests?" + query);
      if (!append) requestBody.replaceChildren();
      for (const request of page.data) {
        const row = requestBody.insertRow();
        [request.id, request.site_id, request.responder, request.response_business_minutes, request.within_target, request.completed_late].forEach(value => cell(row, value));
      }
      cursor = page.next_cursor;
      next.hidden = !cursor;
      count.textContent = `(${requestBody.rows.length} shown${cursor ? ", more available" : ""})`;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const values = new FormData(form);
      params = currentParams();
      cursor = null;
      setStatus("Loading...");
      try {
        const reportQuery = new URLSearchParams({ from: values.get("from"), to: values.get("to") });
        const report = await getJSON("/api/sla-report?" + reportQuery);
        responderBody.replaceChildren();
        for (const responder of report.responders) {
          const row = responderBody.insertRow();
          [responder.name, responder.requests, responder.within_target, responder.completed_late].forEach(value => cell(row, value));
        }
        fillSelect(form.elements.site_id, [...new Set(report.requests.map(request => request.site_id))].sort((a, b) => a - b).map(siteId => [siteId, `Site ${siteId}`]));
        fillSelect(form.elements.responder_id, report.responders.map(responder => [responder.id, `${responder.name} (${responder.id})`]));
        const noResponse = report.requests.filter(request => request.responder_id === null).length;
        setStatus(`${report.requests.length} requests in range (${noResponse} with no response yet)`);
        await loadPage(false);
      } catch (error) { setStatus(error.message || String(error), true); }
    });
    next.addEventListener("click", async () => {
      try { await loadPage(true); } catch (error) { setStatus(error.message || String(error), true); }
    });
    // CSV uses the current filters; from/to are required, same as the report.
    csv.addEventListener("click", () => {
      const query = currentParams();
      if (!query.get("from") || !query.get("to")) { setStatus("Pick a From and To date first.", true); return; }
      query.delete("limit");
      window.location = "/api/requests.csv?" + query;
    });
  </script>
</body>
</html>
